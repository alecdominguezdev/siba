name: siba
description: "Aplicación de SIBA para proyectos y control de obra."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Conexión con el servidor
  http: ^1.3.0

  # Almacenamiento de sesión
  flutter_secure_storage: ^9.2.4

  # Firebase y notificaciones
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^19.4.0

  # Ubicación y autenticación del dispositivo
  geolocator: ^13.0.3
  local_auth: ^2.3.0

  # Archivos, fotografías y documentos compartidos
  file_picker: ^8.3.7
  image_picker: ^1.1.2
  listen_sharing_intent: ^1.9.0

  # Abrir documentos y enlaces
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true